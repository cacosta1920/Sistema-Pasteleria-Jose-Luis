<!-- PATRÓN 1: Formulario de Autenticación -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md">
  <div class="bg-white w-full max-w-md mx-4 rounded-3xl shadow-2xl overflow-hidden border border-pastry-100">

    <div class="bg-gradient-to-r from-pastry-800 via-pastry-700 to-pastry-900 p-8 text-center relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-pastry-500/20 rounded-full blur-xl"></div>
      <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner border border-white/20">
        <i class="fa-solid fa-cake-candles text-4xl text-pastry-200"></i>
      </div>
      <h2 class="font-serif text-3xl font-bold text-white tracking-wide">Pastelería José Luis</h2>
      <p class="text-pastry-200 text-xs mt-1 font-light tracking-wider uppercase">Sistema de Control de Ventas v2.6</p>
    </div>

    <form (ngSubmit)="ingresar()" class="p-8 space-y-5">

      @if (error()) {
        <div class="p-3 rounded-xl bg-red-50 text-red-700 text-xs font-medium border border-red-200 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation text-base"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Usuario</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" name="username" [(ngModel)]="username" maxlength="30" autocomplete="username"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pastry-500 focus:border-transparent text-sm bg-slate-50 transition"
                 placeholder="Ej. admin o vendedor">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" name="password" [(ngModel)]="password" maxlength="64" autocomplete="current-password"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pastry-500 focus:border-transparent text-sm bg-slate-50 transition"
                 placeholder="••••••••">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" [disabled]="cargando()"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-pastry-600 to-pastry-800 text-white font-semibold rounded-xl shadow-lg shadow-pastry-600/30 hover:from-pastry-700 hover:to-pastry-900 transition duration-200 flex items-center justify-center gap-2 text-sm disabled:opacity-60">
          <i class="fa-solid fa-right-to-bracket"></i>
          {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>
      </div>

      <div class="mt-4 pt-4 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400 mb-2">Acceso Rápido Demo (Clic para llenar):</p>
        <div class="flex justify-center gap-2">
          <button type="button" (click)="llenar('admin', 'Admin#2026')"
                  class="px-3 py-1.5 text-xs bg-pastry-50 text-pastry-700 rounded-lg border border-pastry-200 hover:bg-pastry-100 font-medium transition">
            <i class="fa-solid fa-user-shield text-xs mr-1"></i> Admin
          </button>
          <button type="button" (click)="llenar('vendedor', 'Vend#2026')"
                  class="px-3 py-1.5 text-xs bg-slate-100 text-slate-700 rounded-lg border border-slate-200 hover:bg-slate-200 font-medium transition">
            <i class="fa-solid fa-store text-xs mr-1"></i> Encargado
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
